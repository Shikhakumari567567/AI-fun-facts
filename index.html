<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Fun Facts</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>AI Fun Facts</h1>
    <p>Discover something interesting about the world!</p>

    <button id="factBtn" type="button">
      Get a Fun Fact
    </button>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <h2>Did You Know?</h2>
      <p id="factText"></p>
    </section>
  </main>
</body>
</html>
